name: WORDX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build WORDX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Android SDK is available."

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html
          echo "WORDX web application verified."

      - name: Generate Android project
        run: npx cap add android

      - name: Restore Firebase Android configuration
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json is missing from the repository root."
            exit 1
          fi
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/google-services.json
          echo "Android project verified."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Extract APK signing fingerprints
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK"

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "WORDX APK generated successfully."

      - name: Upload WORDX APK
        uses: actions/upload-artifact@v4
        with:
          name: WORDX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
