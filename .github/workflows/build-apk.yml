name: WORDX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build WORDX APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Verify web build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated."
            exit 1
          fi
          echo "Web build output verified."

      - name: Verify Android project
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Android project or Gradle wrapper is missing."
            echo "The Android platform must be added to the repository or generated before this step."
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "WORDX APK generated successfully."

      - name: Upload WORDX APK
        uses: actions/upload-artifact@v4
        with:
          name: WORDX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
